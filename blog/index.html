<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuantumDev Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      background: #0e0e0e;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 2rem;
    }
    .posts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .post {
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 20px;
      background: #161616;
      transition: 0.3s;
    }
    .post:hover {
      border-color: #4f46e5;
    }
    .tags span {
      background: #4f46e5;
      padding: 3px 8px;
      border-radius: 8px;
      margin-right: 5px;
      font-size: 0.75rem;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    #post-content {
      margin-top: 40px;
    }
    #back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #4f46e5;
      border-radius: 8px;
      color: white;
      
    }
    #back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="navbar-toggler" onclick="toggleNavbar()">
      <div class="bar bar1"></div>
      <div class="bar bar2"></div>
      <div class="bar bar3"></div>
    </button>
    <div class="navbar-links" id="navbar-links">
      <a class="nav-item home-link" href="/">Home</a>
      <a class="nav-item" href="/projects/">Projects</a>
      <a class="nav-item" href="/blog/">Blog</a>
      <a class="nav-item" href="/about/">About</a>
    </div>
  </nav>

  <input type="text" id="search" placeholder="Search posts..." style="width: 100%; padding: 10px; margin-top: 20px; background: #1e1e1e; border: none; border-radius: 8px; color: white;" />

  <div class="posts" id="posts"></div>
  <div id="post-content" style="display: none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="assets/marked.min.js"></script>
  <script src="assets/script.js"></script>
  <script>
    function toggleNavbar() {
      const navbarLinks = document.getElementById('navbar-links');
      navbarLinks.classList.toggle('active');

      const bars = document.querySelectorAll('.bar');
      bars.forEach(bar => bar.classList.toggle('active'));
    }
  </script>

</body>
</html>
