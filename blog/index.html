<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuantumDev Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      background: #0e0e0e;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 2rem;
    }
    .posts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .post {
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 20px;
      background: #161616;
      transition: 0.3s;
    }
    .post:hover {
      border-color: #4f46e5;
    }
    .tags span {
      background: #4f46e5;
      padding: 3px 8px;
      border-radius: 8px;
      margin-right: 5px;
      font-size: 0.75rem;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    #post-content {
      margin-top: 40px;
    }
    #back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #4f46e5;
      border-radius: 8px;
      text-decoration: none;
      color: white;
    }

    /* === CUSDIS Dark Theme === */
    :root {
      --cusdis-color: #ffffff;
      --cusdis-bg: #111827;
      --cusdis-border-color: #2d2d2d;
      --cusdis-color-secondary: #9ca3af;
      --cusdis-color-placeholder: #6b7280;
      --cusdis-color-input-bg: #1e293b;
      --cusdis-color-button-bg: #4f46e5;
      --cusdis-color-button-text: #ffffff;
      --cusdis-color-button-hover-bg: #4338ca;
    }

    iframe[src*="cusdis.com"] {
      width: 100% !important;
      border: none !important;
    }

    /* Style for the LikeBtn wrapper to center it and make it visually appealing */
    .likebtn-wrapper {
      display: inline-block;
      position: relative;
      margin-top: 20px; /* Add some space above the Like button */
      margin-bottom: 20px; /* Add some space below the Like button */
      padding: 10px;
      border-radius: 50%; /* Make it round */
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1); /* Subtle shadow */
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    /* Hover effect for the Like button */
    .likebtn-wrapper:hover {
      transform: scale(1.1); /* Slightly enlarge the button when hovered */
      box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.2); /* Darker shadow on hover */
    }

    /* Style the Like button's icon */
    .likebtn-wrapper .likebtn {
      width: 40px;
      height: 40px;
      border-radius: 50%; /* Make the icon circular */
      background-color: #5c6bc0; /* Custom color (adjust for your design) */
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      transition: background-color 0.3s ease;
    }

    /* Hover effect for the Like button icon */
    .likebtn-wrapper .likebtn:hover {
      background-color: #3f51b5; /* Darker shade when hovering */
    }

    /* Additional text style for the Like button */
    .likebtn-wrapper .likebtn-text {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      text-align: center;
    }

    /* Make sure the button is aligned with the post content */
    #post-content {
      padding: 20px;
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
    }

    /* Back link styling */
    #back {
      color: #5c6bc0;
      font-size: 16px;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
      transition: color 0.3s ease;
    }

    #back:hover {
      color: #3f51b5;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <button class="navbar-toggler" onclick="toggleNavbar()">
      <div class="bar bar1"></div>
      <div class="bar bar2"></div>
      <div class="bar bar3"></div>
    </button>
    <div class="navbar-links" id="navbar-links">
      <a class="nav-item home-link" href="/">Home</a>
      <a class="nav-item" href="/projects/">Projects</a>
      <a class="nav-item" href="/blog/">Blog</a>
      <a class="nav-item" href="/about/">About</a>
    </div>
  </nav>

  <input type="text" id="search" placeholder="Search posts..." style="width: 100%; padding: 10px; margin-top: 20px; background: #1e1e1e; border: none; border-radius: 8px; color: white;" />

  <div class="posts" id="posts"></div>
  <div id="post-content" style="display: none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="assets/marked.min.js"></script>
  <script src="assets/script.js"></script>
  <script>
    function toggleNavbar() {
      const navbarLinks = document.getElementById('navbar-links');
      navbarLinks.classList.toggle('active');

      const bars = document.querySelectorAll('.bar');
      bars.forEach(bar => bar.classList.toggle('active'));
    }
  </script>

</body>
</html>
