<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex">
    <title>Page not found</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#fff;background:#111;display:flex;align-items:center;justify-content:center}</style>
  </head>
  <body>
    <div>
      <h1>Page not found</h1>
      <p>Loading app…</p>
    </div>

    <script>
      // SPA-friendly fallback for Pages: load index.html so the client router can handle the route
      fetch('/index.html')
        .then(function(res){ return res.text(); })
        .then(function(html){
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function(){
          // if that fails, redirect to root as a last resort
          window.location.replace('/');
        });
    </script>
  </body>
</html>
